<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning CSS</title>
    <style>
        /*universal selector*/
        *{
            font-style: italic;
        }

        /*element selector*/
        p{
            font-size: 50px;
        }

        /*class selector*/
        .eighth{
            background-color: rgba(234, 199, 153, 0.766);
        }

        /*id selector*/
       #Cody{
            border: 3px solid black;
       }  

    </style>
</head>
<body>
    <h1 style="color: chocolate; font-family: 'Times New Roman', Times, serif;">Learning CSS</h1>

    <p style="color: aqua; font-family: cursive;">Hi! My name is Cody.</p>
    <p id="Cody">I will teach different ways of CSS.</p>
    <h2 class="eighth">We will also learn internal CSS.</h2>
    <p class="eighth">Internal CSS is very useful.</p>
</body>
</html>
